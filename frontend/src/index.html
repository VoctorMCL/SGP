<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SGP · Sistema de Gestión de Parqueo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="description" content="SGP — Control inteligente de parqueaderos en tiempo real.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('sgp-theme');
        if (tema !== 'light' && tema !== 'dark') {
          // Sin preferencia guardada se sigue al dispositivo.
          tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : (window.matchMedia ? 'light' : 'dark');
        }
        document.documentElement.setAttribute('data-theme', tema);
        document.documentElement.style.colorScheme = tema;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', tema === 'light' ? '#f4f6fb' : '#05070b');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
